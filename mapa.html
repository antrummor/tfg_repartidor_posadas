<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta - Repartidor Posadas</title>
</head>
<body>
    <p>Abriendo la nueva pagina de ruta...</p>
    <p><a href="http://127.0.0.1:8000/ruta">Abrir ruta</a></p>
    <script>
        const target = window.location.protocol === "file:" ? "http://127.0.0.1:8000/ruta" : "/ruta";
        window.location.replace(target);
    </script>
</body>
</html>
